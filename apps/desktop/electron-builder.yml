appId: com.keithagroves.codeswim
productName: codeswim
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Electron-builder's `**/*` default is suppressed once we list positive
  # includes below — so the electron-vite outputs must be named explicitly.
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # Kokoro's voice style files for the whiteboard's natural voice
  # (copied by electron.vite.config.ts, copyKokoroVoices).
  - out/voices/**
  # The opencode binary + our harness output need to be inside the package.
  - out/harness/**
  # Under npm workspaces these runtime packages are hoisted to the *monorepo
  # root* node_modules, not apps/desktop/node_modules — so collect them from
  # there and map them back to node_modules/ inside the package. The filter
  # globs that don't match (cross-platform opencode binaries that aren't
  # installed for this host) are silently skipped.
  - from: ../../node_modules
    to: node_modules
    filter:
      - opencode-ai/**
      - opencode-darwin-arm64/**
      - opencode-darwin-x64/**
      - opencode-linux-arm64/**
      - opencode-linux-x64/**
      - opencode-windows-x64/**
      - node-pty/**
# The bundled demo workspace ("Try the demo" on the start screen) — copied
# into userData at first use so it's writable.
extraResources:
  - from: ../../examples/sample-architecture
    to: demo
  # The whiteboard's speech models (~240 MB): the natural voice and speech
  # mode's speech recognition, so neither needs a download after install.
  # Fetched by scripts/fetch-models.mjs (the build:* scripts run it); outside
  # the asar so onnxruntime reads them from disk.
  - from: models
    to: models
asarUnpack:
  - resources/**
  # opencode is a spawned binary — must live on disk, not inside app.asar.
  - node_modules/opencode-ai/**
  - node_modules/opencode-*/**
  # Our plugin is loaded by opencode via a file:// URL, which can't read
  # inside app.asar. Unpack so the path is real.
  - out/harness/**
  # node-pty ships a native .node binary that cannot be loaded from inside asar.
  - node_modules/node-pty/**
  # Same for onnxruntime-node's binding and its shared library.
  - node_modules/onnxruntime-node/**
win:
  executableName: codeswim
  # onnxruntime-node (the whiteboard's natural voice) ships every OS's
  # binaries (~210 MB); keep only this one's. It's collected automatically as
  # a production dependency.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**'
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v3/{linux,win32}/**'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Speech mode listens so you can talk to the whiteboard. What you say is transcribed on this Mac.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  executableName: codeswim
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}/**'
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: keithagroves
  repo: codeswim
