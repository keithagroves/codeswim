appId: com.keithagroves.codeswim
productName: codeswim
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Electron-builder's `**/*` default is suppressed once we list positive
  # includes below — so the electron-vite outputs must be named explicitly.
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # The opencode binary + our harness output need to be inside the package.
  - out/harness/**
  # Under npm workspaces these runtime packages are hoisted to the *monorepo
  # root* node_modules, not apps/desktop/node_modules — so collect them from
  # there and map them back to node_modules/ inside the package. The filter
  # globs that don't match (cross-platform opencode binaries that aren't
  # installed for this host) are silently skipped.
  - from: ../../node_modules
    to: node_modules
    filter:
      - opencode-ai/**
      - opencode-darwin-arm64/**
      - opencode-darwin-x64/**
      - opencode-linux-arm64/**
      - opencode-linux-x64/**
      - opencode-windows-x64/**
      - node-pty/**
# The bundled demo workspace ("Try the demo" on the start screen) — copied
# into userData at first use so it's writable.
extraResources:
  - from: ../../examples/sample-architecture
    to: demo
asarUnpack:
  - resources/**
  # opencode is a spawned binary — must live on disk, not inside app.asar.
  - node_modules/opencode-ai/**
  - node_modules/opencode-*/**
  # Our plugin is loaded by opencode via a file:// URL, which can't read
  # inside app.asar. Unpack so the path is real.
  - out/harness/**
  # node-pty ships a native .node binary that cannot be loaded from inside asar.
  - node_modules/node-pty/**
win:
  executableName: codeswim
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: keithagroves
  repo: codeswim
