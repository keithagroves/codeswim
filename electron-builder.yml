appId: com.keithagroves.codeswim
productName: codeswim
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Electron-builder's `**/*` default is suppressed once we list positive
  # includes below — so the electron-vite outputs must be named explicitly.
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # The opencode binary + our harness output need to be inside the package.
  - out/harness/**
  - node_modules/opencode-ai/**
  - node_modules/opencode-darwin-arm64/**
  - node_modules/opencode-darwin-x64/**
  - node_modules/opencode-linux-arm64/**
  - node_modules/opencode-linux-x64/**
  - node_modules/opencode-windows-x64/**
asarUnpack:
  - resources/**
  # opencode is a spawned binary — must live on disk, not inside app.asar.
  - node_modules/opencode-ai/**
  - node_modules/opencode-*/**
  # Our plugin is loaded by opencode via a file:// URL, which can't read
  # inside app.asar. Unpack so the path is real.
  - out/harness/**
win:
  executableName: codeswim
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: keithagroves
  repo: codeswim
