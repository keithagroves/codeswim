name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run build:mac --workspace @codeswim/desktop -- --publish always -c.mac.notarize=true
          - os: windows-latest
            build: npm run build:win --workspace @codeswim/desktop -- --publish always
          - os: ubuntu-latest
            build: npm run build:linux --workspace @codeswim/desktop -- --publish always

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build and publish
        # The Linux .deb step crashes in electron-builder's fpm on current
        # runners; the AppImage still uploads. Tolerate only the Linux leg so
        # a known-bad .deb doesn't turn the whole release red. mac/win must
        # still pass.
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the app at build time (normally read from the
          # gitignored .env): the deployed PartyServer chat worker and the
          # GitHub OAuth client id for chat sign-in. Neither is a secret.
          VITE_PARTY_HOST: ${{ vars.VITE_PARTY_HOST }}
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.MAIN_VITE_GITHUB_CLIENT_ID }}
          # macOS signing + notarization. Scoped to macOS so the mac .p12 in
          # CSC_LINK doesn't get picked up as a Windows signing cert.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build }}

  # electron-builder uploads artifacts to a *draft* release; nothing promotes
  # it. Flip it to published once the builds are in — this is also what fires
  # the landing-page refresh (which triggers on release: published).
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
